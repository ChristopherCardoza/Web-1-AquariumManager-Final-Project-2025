<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aquarium Tank Manager</title>  
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="tank-manager.css" />

    
    <script type="module" defer src="tank-manager.js"></script>
  </head>
  <body>
    <div class="tank-manager-container">
      <!-- Header Section -->
      <header class="tank-manager-header">
        <div class="header-left">
          <span class="dashboard-label">Dashboard</span>
          <div class="profile-header-info">
            <div class="profile-image-container">
              <img
                id="header-profile-img"
                class="profile-image"
                src=""
                alt="Profile"
              />
              <span class="profile-img-placeholder">profile img</span>
            </div>
            <h1 class="app-title">aquarium manager</h1>
          </div>
        </div>
      </header>

      <!-- Main Content Area -->
      <main class="tank-manager-main">
        <div class="tanks-container" id="tanks-container">
          <!-- Tank cards will be dynamically inserted here -->
        </div>

        <!-- Add Tank Button -->
        <button
          id="add-tank-btn"
          class="add-tank-button"
          aria-label="Add new tank"
        >
          <span class="add-tank-plus">+</span>
        </button>
      </main>
    </div>
  </body>
</html>
